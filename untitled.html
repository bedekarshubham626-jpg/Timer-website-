<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Study Timer</title>

<!-- AdSense Script (Replace ca-pub-XXXX) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXX" crossorigin="anonymous"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #0f172a;
  color: white;
  margin: 0;
}

header {
  padding: 15px;
  background: #1e293b;
}

.container {
  margin-top: 40px;
}

.timer {
  font-size: 60px;
  margin: 20px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.start { background: green; color: white; }
.pause { background: orange; color: white; }
.reset { : red; color: white; }

input {
  padding: 8px;
  width: 60px;
  border-radius: 6px;
  border: none;
  text-align: center;
}

footer {
  margin-top: 50px;
  padding: 20px;
  background: #1e293b;
}
</style>
</head>

<body>

<header>
  <h2>⏱ Pro Study Timer</h2>
</header>

<!-- Top Ad -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXX"
     data-ad-slot="1111"
     data-ad-format="auto"></ins>
<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<div class="container">

<input type="number" id="min" placeholder="Min">
<input type="number" id="sec" placeholder="Sec">

<div class="timer" id="display">00:00</div>

<button class="start" onclick="start()">Start</button>
<button class="pause" onclick="pause()">Pause</button>
<button class="reset" onclick="reset()">Reset</button>

</div>

<!-- Middle Ad -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXX"
     data-ad-slot="2222"
     data-ad-format="auto"></ins>
<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<footer>
  <p>© 2026 Pro Timer | Privacy Policy | Contact</p>
</footer>

<!-- Bottom Ad -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-XXXX"
     data-ad-slot="3333"
     data-ad-format="auto"></ins>
<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<script>
let time = 0;
let timer;
let running = false;

function update() {
  let m = Math.floor(time / 60);
  let s = time % 60;
  document.getElementById("display").innerText =
    String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function start() {
  if (running) return;

  if (time === 0) {
    let m = +document.getElementById("min").value || 0;
    let s = +document.getElementById("sec").value || 0;
    time = m * 60 + s;
  }

  running = true;

  timer = setInterval(() => {
    time--;
    update();

    if (time <= 0) {
      clearInterval(timer);
      running = false;
      alert("Time's up!");
    }

  }, 1000);
}

function pause() {
  clearInterval(timer);
  running = false;
}

function reset() {
  clearInterval(timer);
  running = false;
  time = 0;
  update();
}
</script>

</body>
</html>
